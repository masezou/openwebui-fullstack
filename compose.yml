      # ------- Code interpreter -------
      ENABLE_CODE_INTERPRETER: "true"
      CODE_EXECUTION_TIMEOUT: "120"
      CODE_EXECUTION_MAX_OUTPUT: "100000"
      CODE_EXECUTION_ALLOW_INSTALL: "true"
      CODE_EXECUTION_SANDBOX: "false"

      # ----- Redis / Valkey for sessions and websocket -----
      REDIS_URL: redis://valkey:6379/0
      WEBSOCKET_MANAGER: redis
      WEBSOCKET_REDIS_URL: redis://valkey:6379/0
      REDIS_KEY_PREFIX: open-webui

      # ------- RAG -------
      # ---- Vector DB ----
      # VECTOR_DB is PersistentConfig, thus this value will be fixed when initial startup occurred.
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: "Change-Me-qdrant"
      QDRANT_COLLECTION_PREFIX: open-webui
      ENABLE_QDRANT_MULTITENANCY_MODE: "True"
      QDRANT_PREFER_GRPC: "false"
      QDRANT_TIMEOUT: "10"
      # ----- RAG Content Extraction Engine (optional) -----
      CONTENT_EXTRACTION_ENGINE: tika
      TIKA_SERVER_URL: http://tika:9998
      # ----- EMBEDDING ENGINE -----
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text:v1.5
      RAG_OLLAMA_BASE_URL: http://ollama:11434 # Ollama base URL for embeddings (service name on the same Docker network)
      #RAG_OLLAMA_BASE_URL: http://192.0.2.10:11434

      # ----- RERANKING -----
      # Note:
      # - Reranking is handled by Open WebUI locally, not by Ollama.
      # - Use BAAI/bge-reranker-v2-m3 for Japanese or multilingual RAG.
      # - When reranking is enabled, set RAG_TOP_K higher than RAG_RERANKING_TOP_N.

      # High accuracy / Japanese / multilingual
      RAG_RERANKING_MODEL: BAAI/bge-reranker-v2-m3
      RAG_TOP_K: "20"
      RAG_RERANKING_TOP_N: "5"

      # Medium weight / English demo
      # RAG_RERANKING_MODEL: cross-encoder/ms-marco-MiniLM-L-12-v2
      # RAG_TOP_K: "10"
      # RAG_RERANKING_TOP_N: "3"

      # Lightweight / no reranking model
      # RAG_RERANKING_MODEL: ""
      # RAG_TOP_K: "10"
      # RAG_RERANKING_TOP_N: "3"

      # --- Open Terminal Integration ---
      TERMINAL_SERVER_CONNECTIONS: >-
        [
          {
            "id":"open-terminal",
            "url":"http://open-terminal:8000",
            "key":"Change-Me-OpenTerminal-3yACKsEdk4y0U8ONJqX64INPHt1fi_lsqGtf4wZUwYF",
