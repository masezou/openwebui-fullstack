            "key":"Change-Me-Terminals-ACKsEdk4y0U8ONJqX64INPHt1fi_lsqGtf4wZUwYF",
            "name":"Chat Terminal",
            "auth_type":"bearer",
            "enabled": true,
            "config":{"access_grants":[]}
          }
        ]

      # --- MCP Integration ---
      TOOL_SERVER_CONNECTIONS: |
        [
          {
            "url": "http://mcpo:8000/memory",
            "path": "openapi.json",
            "auth_type": "none",
            "key": "",
            "config": { "enable": true },
            "info": {
              "name": "mcp.memory",
              "description": "MCPO memory MCP server"
            }
          },
          {
            "url": "http://mcpo:8000/time",
            "path": "openapi.json",
            "auth_type": "none",
            "key": "",
            "config": { "enable": true },
            "info": {
              "name": "mcp.time",
              "description": "MCPO time MCP server (Asia/Tokyo)"
            }
          },
          {
