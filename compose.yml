      # --- Web Search ---
      # Enable Web Search feature
      ENABLE_WEB_SEARCH: "true"

      # Search backend
      #WEB_SEARCH_ENGINE: "duckduckgo"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search"

      # Search behavior
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "1"

      # Page fetching
      WEB_LOADER_CONCURRENT_REQUESTS: "2"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "false"

      # Advanced behavior
      BYPASS_WEB_SEARCH_WEB_LOADER: "false"
      WEB_FETCH_MAX_CONTENT_LENGTH: "50000"

      ENABLE_OPENAI_API: "true"
      # ====== A) OpenAI-compatible connection (/v1 endpoint) ======
      # Use Ollama as an OpenAI-compatible server (e.g., Chat Completions)
      # OPENAI_API_BASE_URL: http://ollama:11434/v1
      # API key is practically unused by Ollama, but keep it for client compatibility
      # OPENAI_API_KEY: ollama-local

      # ====== C) OpenAI connection (/v1 endpoint) ======
      # OPENAI_API_KEY is in env_file for security.

      HF_HUB_OFFLINE: "0"               # Forcedly put into online mode
      HF_HUB_DISABLE_TELEMETRY: "1"     # (Optional) Disable only telemetry
      # ----- Whisper / Audio STT (local Whisper) -----
      # USE_CUDA/DEVICE_TYPE control internal Torch device for local models (incl. Whisper).
      AUDIO_STT_ENGINE: "whisper"
      AUDIO_STT_MODEL: "whisper"

      # Whisper model configuration for local STT.
      # This name is resolved via faster-whisper; you can change to medium/distil-large-v3 if needed.
      WHISPER_MODEL: guillaumekln/faster-whisper-small
      # Chunk length (seconds) for long audio; adjust for very long files.
      WHISPER_CHUNK_LENGTH: "30"

      # --- Text to Speech (optional) ---
      AUDIO_TTS_ENGINE: openai
      # AUDIO_TTS_OPENAI_API_BASE_URL: http://openai-edge-tts:5050/v1
