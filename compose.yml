      AUDIO_TTS_MODEL: tts-1
      AUDIO_TTS_SPLIT_ON: punctuation

      # --- Language Setting ---
      TZ: Asia/Tokyo
      DEFAULT_LOCALE: en                                 # Default language
      WHISPER_LANGUAGE: ja
      # AUDIO_TTS_VOICE: ja-JP-NanamiNeural
      AUDIO_TTS_VOICE: jf_alpha
      VOICE_MODE_PROMPT_TEMPLATE: |-
        You are a voice assistant. Always speak in Japanese.
        When English words or phrases appear in the user's input or when English terminology is necessary for clarity, output those English parts exactly as English text without translation.
        Do not convert English terms into katakana.
        The English portions should remain as-is so that the TTS engine produces native English pronunciation.
        All explanations, reasoning, and conversational content must be in natural, polite, and easy-to-understand Japanese.
        Keep responses concise and suitable for voice conversation.

      # Google Drive Integration
      #ENABLE_GOOGLE_DRIVE_INTEGRATION: "true"
      #GOOGLE_DRIVE_CLIENT_ID: "xxxxxxxx.apps.googleusercontent.com"
      #GOOGLE_DRIVE_API_KEY: "xxxxxxxxxxxxxxxxxxxxxxxx"

      # One Drive Integration
      #ENABLE_ONEDRIVE_INTEGRATION: "true"
      #ENABLE_ONEDRIVE_PERSONAL: "true"
      #ONEDRIVE_CLIENT_ID_PERSONAL: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

      # ----- Proxies (optional) -----
      # http_proxy: http://proxy.local:3128
      # http_proxy: http://proxy.local:3128
      # no_proxy: .example.com,127.0.0.1,localhost

      # ----- LOG (optional) -----
      AUDIT_LOG_LEVEL: REQUEST
      # ----- MISC (optional) -----
      ADMIN_EMAIL: admin@example.com

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:8080"
        ]
    depends_on:
      ollama:
        condition: service_healthy
      mcpo:
        condition: service_healthy
      pipeline:
        condition: service_healthy
      openai-edge-tts:
        condition: service_healthy
      open-terminal:
        condition: service_healthy
      terminals:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      tika:
        condition: service_healthy
      searxng:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      llm-net: {}

  # connect sppeach.microsoft.com
  # openai-edge-tts:
  #   <<: *common
  #   image: travisvn/openai-edge-tts:latest
  #   container_name: openai-edge-tts
  #   restart: unless-stopped
  #   labels:
  #     com.centurylinklabs.watchtower.enable: "true"
  #   environment:
  #     # set same value with AUDIO_TTS_OPENAI_API_KEY in OpenWebUI
  #     API_KEY: "Change-Me-tts_api_key"
  #     PORT: "5050"
  #
  #     DEFAULT_VOICE: "ja-JP-NanamiNeural"
  #     DEFAULT_RESPONSE_FORMAT: "mp3"
  #     DEFAULT_SPEED: "1.0"
  #     DEFAULT_LANGUAGE: ja-JP
  #     REQUIRE_API_KEY: "True"
  #     REMOVE_FILTER: "False"
  #     EXPAND_API: "True"
  #   healthcheck:
  #       test:
  #           [
  #               "CMD-SHELL",
  #               "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/v1/models', timeout=5);\""
  #           ]
  #       interval: 30s
  #       timeout: 10s
  #       retries: 10
  #       start_period: 30s
  #   networks:
  #     llm-net: {}

  openai-edge-tts:
    <<: *common
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    # image: ghcr.io/remsky/kokoro-fastapi-gpu:latest  # only works sm_90 / sm_120 blackwell does't work
    # gpus: all
    container_name: openai-edge-tts
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8880:8880"
    environment:
      TZ: Asia/Tokyo
    healthcheck:
        test:
            [
                "CMD-SHELL",
                "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/v1/models', timeout=5);\""
            ]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 60s
    networks:
      llm-net: {}

  searxng:
    <<: *common
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      INSTANCE_NAME: searxng
      TZ: Asia/Tokyo
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      llm-net: {}

  valkey:
    <<: *common
    image: valkey/valkey:latest
    container_name: valkey
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      llm-net: {}

  mcpo:
    <<: *common
    image: ghcr.io/open-webui/mcpo:latest
    container_name: mcpo
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--config"
      - "/app/config/config.json"
      - "--hot-reload"
    ports:
      - "8000:8000"                       # Open docs from outside: http://<host>:8000/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mcpo/config.json:/app/config/config.json:ro
      - ./mcpo/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/time/openapi.json', timeout=3); sys.exit(0)"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      llm-net: {}

  pipeline:
    <<: *common
    image: ghcr.io/open-webui/pipelines:latest-cuda
    gpus: all
    container_name: pipeline
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./pipelines:/app/pipelines
    environment:
      PIPELINES_API_KEY: "Change-Me-PIPELINES_API_KEY"

      # Default Ollama endpoint for other pipelines
      OLLAMA_BASE_URL: http://ollama:11434
      #OLLAMA_BASE_URL: http://192.0.2.10:11434

      # pipeline customization pipeline/ollama-lmstudio_manifold.py
      # Dedicated CPU Ollama endpoint for ollama_manifold_cpu.py
      OLLAMA_CPU_BASE_URL: http://ollama-cpu:11434

      # Dedicated CPU Ollama endpoint for ollama_manifold_cpu.py
      LMSTUDIO_BASE_URL: http://192.0.2.10:1234

      # If you want to use OpenAI API
      # OPENAI_API_BASE_URL: http://ollama:11434/v1
      # OPENAI_API_KEY: ollama-local
      MCPO_BASE_URL: "http://mcpo:8000"
      # SUMMARY_MODEL: "qwen3.5:0.8b"
      SUMMARY_EVERY_N_USER_TURNS: "8"
      SUMMARY_KEEP_LAST_TURNS: "6"
    ports:
      - "9099:9099"     # expose pipelines to host (for curl/debug)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://127.0.0.1:9099"]
    depends_on:
      ollama-cpu:
        condition: service_healthy
    networks:
      llm-net: {}

  open-terminal:
    <<: *common
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    group_add:
      - "988"
    # ports:
    #   - "127.0.0.1:8000:8000"
    environment:
      OPEN_TERMINAL_API_KEY: "Change-Me-OpenTerminal-3yACKsEdk4y0U8ONJqX64INPHt1fi_lsqGtf4wZUwYF"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    working_dir: /workspace
    networks:
      - llm-net
    stdin_open: true
    tty: true
    healthcheck:
        test:
            [
                "CMD-SHELL",
                "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()\""
            ]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 30s

  terminals:
    <<: *common
    image: ghcr.io/open-webui/terminals:latest
    container_name: openwebui-terminals
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TERMINALS_BACKEND: docker
      TERMINALS_API_KEY: "Change-Me-Terminals-ACKsEdk4y0U8ONJqX64INPHt1fi_lsqGtf4wZUwYF"
      TERMINALS_IMAGE: ghcr.io/open-webui/open-terminal:latest
      TERMINALS_NETWORK: llm-net
      TERMINALS_PORT: "3001"
      TERMINALS_HOST: "0.0.0.0"
      TERMINALS_IDLE_TIMEOUT_MINUTES: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/terminals:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
        test:
            [
                "CMD-SHELL",
                "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',3001),5); s.close()\""
            ]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 30s
    networks:
      - llm-net

  qdrant:
    <<: *common
    # image: qdrant/qdrant:v1.17.0
    image: qdrant/qdrant:v1.17.0-gpu-nvidia
    gpus: all
    container_name: qdrant
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "6333:6333"   # Open dashboard from outside: http://<host>:6333/dashboard
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: "Change-Me-qdrant"
      # Enable GPU indexing (important)
      QDRANT__GPU__INDEXING: "1"
      # Optional: make troubleshooting easier
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_storage:/qdrant/storage
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
        test:
            [
                "CMD-SHELL",
                "bash -c '</dev/tcp/127.0.0.1/6333'"
            ]
        interval: 10s
        timeout: 5s
        retries: 20
        start_period: 20s
    stop_grace_period: 60s
    logging:
        driver: local
        options:
            max-size: "20m"
            max-file: "5"
    networks:
      llm-net: {}

  tika:
    <<: *common
    build:
      context: ./tika-ja-full
      dockerfile: Dockerfile
    image: tika-ja-full:local

    container_name: tika
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      LANG: ja_JP.UTF-8
      LANGUAGE: ja_JP:ja
      LC_ALL: ja_JP.UTF-8
      TZ: Asia/Tokyo
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx4g"
    volumes:
      - ./tika-ja-full/tika-config.xml:/tika-config.xml:ro
    command: ["--config", "/tika-config.xml"]
    healthcheck:
        test:
            [
                "CMD-SHELL",
                "wget -q --spider http://127.0.0.1:9998/tika || exit 1"
            ]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 30s
    networks:
      llm-net: {}


  mitmproxy:
    <<: *common
    profiles: ["debug"]
    image: mitmproxy/mitmproxy:latest
    container_name: mitmproxy
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - mitmweb
      - --mode
      - reverse:http://ollama:11434
      #- reverse:http://192.0.2.10:11434
      # Proxy side (Open WebUI → mitmproxy → Ollama)
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8000"
      # Web UI side (Web browser → mitmweb)
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8081"
      - --set
      - web_password=Change-Me-Password
      # Enable from external access
      - --set
      - block_global=false
    volumes:
      - ./mitm-data:/home/mitmproxy
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://ollama:11434/v1/models', timeout=3); sys.exit(0)"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    networks:
      llm-net: {}

  mitmproxy-cpu:
    <<: *common
    profiles: ["debug"]
    image: mitmproxy/mitmproxy:latest
    container_name: mitmproxy-cpu
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - mitmweb
      - --mode
      - reverse:http://ollama-cpu:11434
      # Proxy side (CLI tools → mitmproxy-cpu → ollama-cpu)
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8002"
      # Web UI side (Web browser → mitmweb)
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8083"
      - --set
      - web_password=Change-Me-Password
      # Enable from external access
      - --set
      - block_global=false
    volumes:
      - ./mitm-data-cpu:/home/mitmproxy
    ports:
      - "8083:8083"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://ollama-cpu:11434/v1/models', timeout=3); sys.exit(0)"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      llm-net: {}

volumes:
  qdrant_storage:

networks:
  llm-net:
    name: llm-net
