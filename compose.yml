x-logging: &default-logging
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"
x-common: &common
  restart: unless-stopped
  init: true
  <<: *default-logging

services:
  ollama:
    <<: *common
    gpus: all
    image: ollama/ollama:latest        # GPU-enabled Ollama image; optionally pin a version/digest
    container_name: ollama
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "11434:11434"                  # Ollama API (HTTP); restrict with 127.0.0.1 if external access is not needed
    volumes:
      - ./ollama-gpu:/root/.ollama
      - ./models:/root/.ollama/models
    environment:
      # OLLAMA_DEBUG: "1"              # Enable verbose Ollama debug logs when troubleshooting
      OLLAMA_HOST: 0.0.0.0             # Bind inside the container; use firewall/port binding for actual access control
      OLLAMA_ORIGINS: "*"              # CORS origins for browser clients; this is not network access control
      # OLLAMA_MAX_LOADED_MODELS: "1"  # Limit concurrently loaded models; useful on 16GB VRAM systems
      # OLLAMA_KEEP_ALIVE: 12h         # Keep hot model loaded if memory/VRAM allows
      OLLAMA_KEEP_ALIVE: 1h            # Avoid long model pinning so RAM/VRAM can be freed between tasks
      OLLAMA_LOAD_TIMEOUT: 5m          # Allow enough time for large model loading
      OLLAMA_MULTIUSER_CACHE: "true"   # Share model cache across concurrent users where supported
      OLLAMA_NUM_PARALLEL: "2"         # Concurrent generations per loaded model
      OLLAMA_NUM_THREADS: "6"          # CPU worker threads; adjust for physical cores and host load
      OLLAMA_CONTEXT_LENGTH: "8192"    # Keep context moderate to save RAM/VRAM and reduce latency
      # OLLAMA_SCHED_SPREAD: "1"       # Multi-GPU scheduling hint; usually unnecessary on a single-GPU host
      OLLAMA_FLASH_ATTENTION: "1"      # Enable Flash Attention when supported by GPU/model/runtime

      # OLLAMA_KV_CACHE_TYPE: q8_0     # Lighter KV cache; test quality/speed trade-off before production use
      # OLLAMA_NO_MMAP: "1"            # Use only if memory-mapped model loading causes issues
      # OLLAMA_GPU_LAYERS: "16"        # Manually control GPU offload layers; normally leave unset
      OLLAMA_GPU_OVERHEAD: "2147483648"  # Reserve GPU memory for runtime/other workloads such as ComfyUI
      # OLLAMA_NEW_ENGINE: "1"         # Experimental Ollama engine; enable only for testing   # Experimental Ollama engine; enable only for testing
    healthcheck:
        test:
            [
                "CMD",
                "ollama",
                "list"
            ]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 60s
    stop_grace_period: 60s
    logging:
        driver: local
        options:
            max-size: "20m"
            max-file: "5"
    networks:
      llm-net: {}

  ollama-cpu:
    <<: *common
    image: ollama/ollama:latest
    container_name: ollama-cpu
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "12434:11434"
    volumes:
      - ./ollama-cpu:/root/.ollama
      - ./models:/root/.ollama/models
    environment:
      # OLLAMA_DEBUG: "1"              # Enable verbose Ollama debug logs when troubleshooting
      OLLAMA_HOST: 0.0.0.0             # Bind inside the container; use firewall/port binding for actual access control
      OLLAMA_ORIGINS: "*"              # CORS origins for browser clients; this is not network access control
      # OLLAMA_MAX_LOADED_MODELS: "1"  # Limit concurrently loaded models; useful for CPU fallback hosts
      # OLLAMA_KEEP_ALIVE: 12h         # Keep hot model loaded if memory allows
      OLLAMA_KEEP_ALIVE: 1h            # Avoid long model pinning so RAM can be freed between tasks
      OLLAMA_LOAD_TIMEOUT: 5m          # Allow enough time for large model loading
      OLLAMA_MULTIUSER_CACHE: "true"   # Share model cache across concurrent users where supported
      OLLAMA_NUM_PARALLEL: "1"         # Keep CPU fallback serialized for predictable latency
      OLLAMA_NUM_THREADS: "8"          # CPU worker threads; tune for responsiveness vs. throughput
      OLLAMA_LLM_LIBRARY: cpu_avx2     # Force AVX2 backend for compatible x86_64 CPUs
      OLLAMA_CONTEXT_LENGTH: "8192"    # Keep context moderate to save RAM and reduce latency
      # OLLAMA_FLASH_ATTENTION: "1"    # GPU-only optimization; keep disabled for CPU-only mode
      # OLLAMA_SCHED_SPREAD: "1"       # Multi-GPU scheduling hint; not needed for CPU-only mode

      # OLLAMA_KV_CACHE_TYPE: q4_0     # Lighter KV cache for low-memory CPU boxes; test quality impact
      # OLLAMA_NO_MMAP: "1"            # Use only if memory-mapped model loading causes issues
      # OLLAMA_GPU_LAYERS: "16"        # GPU offload control; keep unset when OLLAMA_NO_GPU is enabled
      OLLAMA_NO_GPU: "1"               # Force CPU-only inference
    healthcheck:
        test:
            [
                "CMD",
                "ollama",
                "list"
            ]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 60s
    stop_grace_period: 60s
    logging:
        driver: local
        options:
            max-size: "20m"
            max-file: "5"
    networks:
      llm-net: {}

  open-webui:
    <<: *common
    #image: ghcr.io/open-webui/open-webui:latest-cuda
    #image: ghcr.io/open-webui/open-webui:dev-cuda
    image: ghcr.io/open-webui/open-webui:0.9.2-cuda
    #image: ghcr.io/open-webui/open-webui:latest
    #image: ghcr.io/open-webui/open-webui:0.9.2
    gpus: all
    container_name: open-webui
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "3000:8080"                            # Web UI -> http://<host>:3000 (HTTP)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./openwebui:/app/backend/data
    environment:
      OFFLINE_MODE: "false"
      # (Optional) If you want environment variables to keep overriding later,
      # disable persistent config at your own risk:
      ENABLE_PERSISTENT_CONFIG: "false"

      # On GPU hosts:
      USE_CUDA: "true"                         # Enable CUDA in Open WebUI backend
      DEVICE_TYPE: cuda                        # Default device for internal tasks (Whisper, embeddings, etc.)
      # On CPU-only hosts, instead set:
      # USE_CUDA: "false"
      # DEVICE_TYPE: cpu

      # ====== Native Ollama connection ======
      # Let Open WebUI directly manage Ollama (pull/remove models, etc.)
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      #OLLAMA_BASE_URL: http://192.0.2.10:11434
      #OLLAMA_BASE_URLS: "http://ollama:11434;http://192.0.2.10:11434"

      # ====== Ollama connects to mitmproxy ======
      # OLLAMA_BASE_URL: http://mitmproxy:8000

      WEBUI_DEFAULT_MODELS: qwen3.5:9b                  # (Optional) preselect default model
      DEFAULT_MODELS: qwen3.5:9b                        # Default model shown in selector (example)
      DEFAULT_PINNED_MODELS: qwen3.5:9b,qwen3.5:0.8b,qwen2.5vl:7b # Default pinned model shown in selector (example)
      ENABLE_CUSTOM_MODEL_FALLBACK: "true"
      MODELS_CACHE_TTL: "300"                            # Cache external model list for 5 minutes
      # TASK_MODEL: qwen3.5:0.8b

      DEFAULT_MODEL_METADATA: >
          {
              "capabilities": {
                  "tools": true,
                  "vision": false
              },
              "reasoning_tags": []
          }

      DEFAULT_MODEL_PARAMS: >
          {
              "temperature": 0.7,
              "top_p": 0.9,
              "repeat_penalty": 1.1,
              "num_ctx": 8192,
              "stream": true,
              "stop": [
                  "</think>"
              ]
          }

      # (For production)
      WEBUI_URL: https://openwebui.example.com:3000          # Public URL (must be set BEFORE enabling SSO)
      CORS_ALLOW_ORIGIN: "https://openwebui.example.com:3000;http://localhost:3000;http://127.0.0.1:3000;http://192.0.2.10:3000"
      CORS_ALLOW_CUSTOM_SCHEME: ""
      ENABLE_COOKIE_SECURE: "false"                      # If  ORS_ALLOW_ORIGIN: "https://FQDN:3000", set true.

      # (For development)
      # WEBUI_URL: http://localhost:3000
      # CORS_ALLOW_ORIGIN: "http://localhost:3000;http://127.0.0.1:3000;http://192.0.2.10:3000"
      # CORS_ALLOW_CUSTOM_SCHEME: ""
      # ENABLE_COOKIE_SECURE: "false"

      # WEBHOOK_URL: "https://discord.com/api/webhooks/XXXXXXXXXX"

      # ----- Admin bootstrap -----
      # Only for initial setup, you can skip registar admin credential when initial setup was occurred.
      # WEBUI_ADMIN_EMAIL: admin@example.com
      # WEBUI_ADMIN_PASSWORD: "Change-Me-Admin-Password"

      ENABLE_API_KEYS: "true"

      # ----- Core -----
      USER_AGENT: "OpenWebUI/0.9.2 (dev-test)"
      ENV: dev                                           # Development / internal test behavior

      # Treat this as first-boot seeding. These "PersistentConfig" values are stored by WebUI after initial launch.
      # ----- Security / Users -----
      WEBUI_AUTH: "true"                                 # If false, there is no authentication but initial setup only.
      # ENABLE_SIGNUP: "false"                           # Disable self-signup in production
      ENABLE_SIGNUP: "true"
      ENABLE_SIGNUP_PASSWORD_CONFIRMATION: "true"
      DEFAULT_USER_ROLE: pending                         # New users require admin approval
      DEFAULT_GROUP_ID: newbie
      WEBUI_AUTH_COOKIE_SECURE: "true"                   # Secure cookies (HTTPS only)
      WEBUI_SESSION_COOKIE_SAME_SITE: "lax"              # Cross-site cookies when behind reverse proxy
      WEBUI_AUTH_COOKIE_SAME_SITE: "lax"
      # BYPASS_ADMIN_ACCESS_CONTROL: "false"             # Enforce access control for admins as well
      # ENABLE_ADMIN_EXPORT: "false"                     # Reduce data exfiltration risk
      WEBUI_SESSION_COOKIE_SECURE: "true"

      WEBUI_SECRET_KEY: "Change-Me-Secret-key"

      ENABLE_FORWARD_USER_INFO_HEADERS: "true"

      DO_NOT_TRACK: "true"

      # ----- API Providers (example: OpenAI-compatible) -----
      # OPENAI_API_BASE_URL: https://api.openai.com/v1   # If using a custom gateway, set it here
      # OPENAI_API_KEY: sk-************************      # Set your key

      # ----- Pipeline (optional) -----
      OPENAI_API_BASE_URL: http://pipeline:9099
      OPENAI_API_KEY: "Change-Me-PIPELINES_API_KEY"

      # ----- OIDC SSO (example values; match your IdP) -----
      # Set WEBUI_URL first. Keep these only if you enable SSO.
      # OAUTH_CLIENT_ID: openwebui-client
      # OAUTH_CLIENT_SECRET: "****super-secret****"
      # Additional issuer/redirect variables per SSO guide/IdP
      # Tip: If you want always-from-ENV, set ENABLE_OAUTH_PERSISTENT_CONFIG=false

      # ----- Performance knobs (optional) -----
      CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE: "12"
      THREAD_POOL_SIZE: "64"

      # ----- Memory (optional) -----
      ENABLE_MEMORIES: "true"

      # ----- Channel (optional) -----
      ENABLE_CHANNELS: "true"

      # ----- Image Generation (optional) -----
      ENABLE_IMAGE_GENERATION: "true"
      # ----- Stable Diffusion (optional) -----
      # IMAGE_GENERATION_ENGINE: automatic1111
      # IMAGE_GENERATION_MODEL: v1-5-pruned-emaonly.safetensors
      # AUTOMATIC1111_BASE_URL: http://sd-webui:7860

      # ----- comfyui (optional) -----
      # If you uses default workflow in openwebui, copy or link realvisxlV50_v50Bakedvae.safetensors to  model.safetensors in ComfyUI/models/checkpoints/
      IMAGE_GENERATION_ENGINE: comfyui
      # COMFYUI_BASE_URL: http://comfyui:8188
      # COMFYUI_BASE_URL: http://host.docker.internal:8188
      COMFYUI_BASE_URL: http://192.0.2.10:8188

      IMAGE_GENERATION_MODEL: model.safetensors

      COMFYUI_WORKFLOW: >
                {
                  "3": {
                    "inputs": {
                      "seed": 0,
                      "steps": 20,
                      "cfg": 8,
                      "sampler_name": "euler",
                      "scheduler": "normal",
                      "denoise": 1,
                      "model": ["4", 0],
                      "positive": ["6", 0],
                      "negative": ["7", 0],
                      "latent_image": ["5", 0]
                    },
                    "class_type": "KSampler",
                    "_meta": {
                      "title": "KSampler"
                    }
                  },
                  "4": {
                    "inputs": {
                      "ckpt_name": "model.safetensors"
                    },
                    "class_type": "CheckpointLoaderSimple",
                    "_meta": {
                      "title": "Load Checkpoint"
                    }
                  },
                  "5": {
                    "inputs": {
                      "width": 512,
                      "height": 512,
                      "batch_size": 1
                    },
                    "class_type": "EmptyLatentImage",
                    "_meta": {
                      "title": "Empty Latent Image"
                    }
                  },
                  "6": {
                    "inputs": {
                      "text": "Prompt",
                      "clip": ["4", 1]
                    },
                    "class_type": "CLIPTextEncode",
                    "_meta": {
                      "title": "CLIP Text Encode (Prompt)"
                    }
                  },
                  "7": {
                    "inputs": {
                      "text": "",
                      "clip": ["4", 1]
                    },
                    "class_type": "CLIPTextEncode",
                    "_meta": {
                      "title": "CLIP Text Encode (Prompt)"
                    }
                  },
                  "8": {
                    "inputs": {
                      "samples": ["3", 0],
                      "vae": ["4", 2]
                    },
                    "class_type": "VAEDecode",
                    "_meta": {
                      "title": "VAE Decode"
                    }
                  },
                  "9": {
                    "inputs": {
                      "filename_prefix": "ComfyUI",
                      "images": ["8", 0]
                    },
                    "class_type": "SaveImage",
                    "_meta": {
                      "title": "Save Image"
                    }
                  }
                }

      COMFYUI_WORKFLOW_NODES: >
         [
            {"type":"prompt","node_ids":["6"],"key":"text"},
            {"type":"model","node_ids":["4"],"key":"ckpt_name"},
            {"type":"width","node_ids":["5"],"key":"width"},
            {"type":"height","node_ids":["5"],"key":"height"},
            {"type":"steps","node_ids":["3"],"key":"steps"},
            {"type":"seed","node_ids":["3"],"key":"seed"},
            {"type":"cfg","node_ids":["3"],"key":"cfg"}
          ]

      # ----- Image EDIT (optional) -----
      ENABLE_IMAGE_EDIT: "true"
      IMAGE_EDIT_ENGINE: comfyui
      IMAGE_EDIT_SIZE: 512x512
      # IMAGES_EDIT_COMFYUI_BASE_URL: http://comfyui:8188
      # IMAGES_EDIT_COMFYUI_BASE_URL: http://host.docker.internal:8188
      IMAGES_EDIT_COMFYUI_BASE_URL: http://192.0.2.10:8188

      IMAGE_EDIT_MODEL: model.safetensors

      IMAGES_EDIT_COMFYUI_WORKFLOW: >
        {
          "3": {
            "inputs": {
              "seed": 0,
              "steps": 20,
              "cfg": 7,
              "sampler_name": "euler",
              "scheduler": "normal",
              "denoise": 0.5,
              "model": ["4", 0],
              "positive": ["6", 0],
              "negative": ["7", 0],
              "latent_image": ["5", 0]
            },
            "class_type": "KSampler"
          },
          "4": {
            "inputs": {
              "ckpt_name": "model.safetensors"
            },
            "class_type": "CheckpointLoaderSimple"
          },
          "5": {
            "inputs": {
              "pixels": ["10", 0],
              "vae": ["4", 2]
            },
            "class_type": "VAEEncode"
          },
          "6": {
            "inputs": {
              "text": "Prompt",
              "clip": ["4", 1]
            },
            "class_type": "CLIPTextEncode"
          },
          "7": {
            "inputs": {
              "text": "",
              "clip": ["4", 1]
            },
            "class_type": "CLIPTextEncode"
          },
          "8": {
            "inputs": {
              "samples": ["3", 0],
              "vae": ["4", 2]
            },
            "class_type": "VAEDecode"
          },
          "9": {
            "inputs": {
              "images": ["8", 0],
              "filename_prefix": "edit"
            },
            "class_type": "SaveImage"
          },
          "10": {
            "inputs": {},
            "class_type": "LoadImage"
          }
        }

      IMAGES_EDIT_COMFYUI_WORKFLOW_NODES: >
        [
          {"type":"prompt","node_ids":["6"],"key":"text"},
          {"type":"model","node_ids":["4"],"key":"ckpt_name"},
          {"type":"image","node_ids":["10"],"key":"image"},
          {"type":"steps","node_ids":["3"],"key":"steps"},
          {"type":"seed","node_ids":["3"],"key":"seed"},
          {"type":"cfg","node_ids":["3"],"key":"cfg"}
